# Builds the aarch64 installation archive for the remote and attaches it
# to a GitHub release when a version tag (e.g. v0.8.4) is pushed.
#
# Creating a release:
#   1. Bump the version in driver.json and update CHANGELOG.md
#   2. Merge into main
#   3. Create the tag: git tag v0.8.4 && git push origin v0.8.4
#      (or on GitHub: Releases -> Draft a new release -> new tag)
name: Build & Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # The free ARM runners are only available for public repositories,
    # so this uses an x86 runner with QEMU emulation for arm64.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Registers QEMU for arm64 (same as docker/setup-qemu-action, but
      # without a Node.js based action)
      - name: Set up QEMU (arm64)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Verify driver.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          DRIVER_VERSION="v$(jq -r .version driver.json)"
          if [ "${GITHUB_REF_NAME}" != "${DRIVER_VERSION}" ]; then
            echo "Version in driver.json (${DRIVER_VERSION}) doesn't match the tag (${GITHUB_REF_NAME})!"
            exit 1
          fi

      - name: Build
        run: bash build.sh

      - name: Checksum
        run: |
          ARCHIVE=$(ls uc-intg-dispatcharr-*-aarch64.tar.gz)
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          ls -lah "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # Runs the packaged arm64 driver under emulation: the self-test
      # processes sample logos with the bundled Pillow, the startup check
      # makes sure the driver comes up and opens its WebSocket server.
      - name: Smoke test (arm64)
        run: |
          mkdir -p smoke && tar xzf "$ARCHIVE" -C smoke
          docker run --rm --platform=linux/arm64 -v "$PWD/smoke":/smoke \
            docker.io/unfoldedcircle/r2-pyinstaller:3.11.13 \
            bash -c 'cd /smoke/bin && ./driver --self-test'
          docker run --rm --platform=linux/arm64 -v "$PWD/smoke":/smoke \
            docker.io/unfoldedcircle/r2-pyinstaller:3.11.13 \
            bash -c 'mkdir -p /tmp/cfg && cd /smoke/bin && \
              UC_CONFIG_HOME=/tmp/cfg timeout 45 ./driver > /tmp/driver.log 2>&1; \
              cat /tmp/driver.log; grep -q "Driver is up" /tmp/driver.log'

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
