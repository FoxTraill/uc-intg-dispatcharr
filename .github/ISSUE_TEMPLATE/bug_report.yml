name: Bug report
description: Something doesn't work as expected
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Please check the [existing issues](https://github.com/FoxTraill/uc-intg-dispatcharr/issues) first.
        If the bug is already known, add your information there instead of opening a new issue.
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    attributes:
      label: Integration version
      description: Shown in the web configurator under Integrations.
      placeholder: e.g. v0.8.4
    validations:
      required: true
  - type: input
    attributes:
      label: Remote model and firmware
      placeholder: e.g. Remote 3, firmware 2.9.3
    validations:
      required: true
  - type: input
    attributes:
      label: Dispatcharr version
      placeholder: e.g. v0.9.0
  - type: textarea
    attributes:
      label: Logs
      description: |
        Web configurator → Settings → Development → Logs.
        Please remove API keys or other private data before posting.
      render: shell
  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, channel names (for logo problems), anything else that might help.
