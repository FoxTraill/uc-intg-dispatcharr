name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]

body:
  - type: textarea
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what's missing today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How should it work on the remote?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, examples from other integrations, anything else.
